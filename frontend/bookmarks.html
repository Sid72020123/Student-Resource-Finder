<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Your saved study resources on this browser." />
        <title>Bookmarks | Resource Finder</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="config.js" defer></script>
        <script src="bookmarks.js" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#main-content">Skip to bookmarks</a>
        <header class="site-header">
            <div class="header-inner">
                <a class="brand" href="index.html">Resource Finder</a>
                <nav aria-label="Main navigation">
                    <a href="index.html">Browse</a><a href="bookmarks.html" aria-current="page">Bookmarks</a
                    ><a href="upload.html">Add a resource</a>
                </nav>
            </div>
        </header>
        <main id="main-content" class="page-shell">
            <h1 class="page-title">Bookmarks</h1>
            <section aria-labelledby="bookmarks-heading">
                <h2 id="bookmarks-heading" class="sr-only">Bookmarked resources</h2>
                <div id="notice" class="notice" role="status" hidden></div>
                <div id="resource-list" class="resource-list" aria-busy="true"></div>
                <p id="empty-state" class="empty-state" hidden>
                    You have no bookmarks yet. Browse resources and save one for later.
                </p>
            </section>
        </main>
    </body>
</html>
